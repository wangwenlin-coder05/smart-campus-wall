<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
        }

        .search-box input, .search-box select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus, .search-box select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .action-btns .btn {
            padding: 5px 10px;
            font-size: 12px;
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .modal-header h2 {
            color: #667eea;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close:hover {
            color: #000;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }

        .pagination button {
            padding: 8px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination span {
            padding: 8px 15px;
            color: #667eea;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 个人信息管理系统</h1>
            <p>用户信息管理与校园职务管理</p>
        </div>

        <div class="content">
            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchUid" placeholder="搜索UID">
                    <input type="text" id="searchPhone" placeholder="搜索手机号">
                    <input type="text" id="searchUsername" placeholder="搜索昵称">
                    <select id="searchStatus">
                        <option value="">全部状态</option>
                        <option value="1">正常</option>
                        <option value="0">禁用</option>
                    </select>
                    <button class="btn btn-primary" onclick="searchUsers()">🔍 搜索</button>
                    <button class="btn btn-warning" onclick="resetSearch()">重置</button>
                </div>
                <button class="btn btn-success" onclick="openAddModal()">➕ 新增用户</button>
            </div>

            <!-- 数据表格 -->
            <table id="userTable">
                <thead>
                    <tr>
                        <th>UID</th>
                        <th>手机号</th>
                        <th>昵称</th>
                        <th>真实姓名</th>
                        <th>学院</th>
                        <th>专业</th>
                        <th>班级</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="9" class="loading">加载中...</td>
                    </tr>
                </tbody>
            </table>

            <!-- 分页 -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- 新增/编辑模态框 -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">新增用户</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="userForm">
                <input type="hidden" id="userId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="uid">UID *</label>
                        <input type="text" id="uid" required placeholder="全局唯一用户ID">
                    </div>
                    <div class="form-group">
                        <label for="phone">手机号 *</label>
                        <input type="tel" id="phone" required placeholder="11位手机号" pattern="[0-9]{11}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="username">昵称</label>
                        <input type="text" id="username" placeholder="用户昵称">
                    </div>
                    <div class="form-group">
                        <label for="realName">真实姓名</label>
                        <input type="text" id="realName" placeholder="真实姓名">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" placeholder="登录密码">
                    </div>
                    <div class="form-group">
                        <label for="gender">性别</label>
                        <select id="gender">
                            <option value="0">未知</option>
                            <option value="1">男</option>
                            <option value="2">女</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="birthday">生日</label>
                        <input type="date" id="birthday">
                    </div>
                    <div class="form-group">
                        <label for="role">角色</label>
                        <select id="role">
                            <option value="0">普通用户</option>
                            <option value="1">管理员</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="studentId">学号</label>
                        <input type="text" id="studentId" placeholder="学号">
                    </div>
                    <div class="form-group">
                        <label for="idCard">身份证号</label>
                        <input type="text" id="idCard" placeholder="18位身份证号">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="college">学院</label>
                        <input type="text" id="college" placeholder="所属学院">
                    </div>
                    <div class="form-group">
                        <label for="major">专业</label>
                        <input type="text" id="major" placeholder="所属专业">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="className">班级</label>
                        <input type="text" id="className" placeholder="班级名称">
                    </div>
                    <div class="form-group">
                        <label for="dormitory">宿舍</label>
                        <input type="text" id="dormitory" placeholder="寝室信息">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="qq">QQ号</label>
                        <input type="text" id="qq" placeholder="QQ号">
                    </div>
                    <div class="form-group">
                        <label for="wechat">微信号</label>
                        <input type="text" id="wechat" placeholder="微信号">
                    </div>
                </div>

                <div class="form-group">
                    <label for="avatar">头像URL</label>
                    <input type="url" id="avatar" placeholder="头像地址">
                </div>

                <div class="form-group">
                    <label for="hobby">爱好</label>
                    <textarea id="hobby" rows="3" placeholder="个人爱好，多个爱好用逗号分隔"></textarea>
                </div>

                <div class="form-group">
                    <label for="status">状态</label>
                    <select id="status">
                        <option value="1">正常</option>
                        <option value="0">禁用</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                    <button type="button" class="btn btn-warning" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-success">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/user';
        let currentPage = 1;
        let pageSize = 10;
        let allUsers = [];

        // 页面加载时获取数据
        window.onload = function() {
            loadUsers();
        };

        // 加载用户列表
        async function loadUsers() {
            try {
                const response = await fetch(`${API_BASE}/list`);
                const result = await response.json();
                
                if (result.code === 1) {
                    allUsers = result.data || [];
                    renderTable(allUsers);
                } else {
                    showMessage('加载失败：' + result.message, 'error');
                }
            } catch (error) {
                console.error('加载用户列表失败:', error);
                showMessage('网络请求失败', 'error');
            }
        }

        // 渲染表格
        function renderTable(users) {
            const tbody = document.getElementById('userTableBody');
            
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty-state">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.uid || '-'}</td>
                    <td>${user.phone || '-'}</td>
                    <td>${user.username || '-'}</td>
                    <td>${user.realName || '-'}</td>
                    <td>${user.college || '-'}</td>
                    <td>${user.major || '-'}</td>
                    <td>${user.className || '-'}</td>
                    <td>
                        <span class="status-badge ${user.status === 1 ? 'status-active' : 'status-inactive'}">
                            ${user.status === 1 ? '正常' : '禁用'}
                        </span>
                    </td>
                    <td class="action-btns">
                        <button class="btn btn-primary" onclick="editUser('${user.uid}')">编辑</button>
                        <button class="btn btn-danger" onclick="deleteUser('${user.uid}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 搜索用户
        async function searchUsers() {
            const uid = document.getElementById('searchUid').value;
            const phone = document.getElementById('searchPhone').value;
            const username = document.getElementById('searchUsername').value;
            const status = document.getElementById('searchStatus').value;

            const condition = {};
            if (uid) condition.uid = uid;
            if (phone) condition.phone = phone;
            if (username) condition.username = username;
            if (status !== '') condition.status = parseInt(status);

            try {
                const response = await fetch(`${API_BASE}/condition`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(condition)
                });
                const result = await response.json();
                
                if (result.code === 1) {
                    allUsers = result.data || [];
                    renderTable(allUsers);
                } else {
                    showMessage('搜索失败：' + result.message, 'error');
                }
            } catch (error) {
                console.error('搜索失败:', error);
                showMessage('网络请求失败', 'error');
            }
        }

        // 重置搜索
        function resetSearch() {
            document.getElementById('searchUid').value = '';
            document.getElementById('searchPhone').value = '';
            document.getElementById('searchUsername').value = '';
            document.getElementById('searchStatus').value = '';
            loadUsers();
        }

        // 打开新增模态框
        function openAddModal() {
            document.getElementById('modalTitle').textContent = '新增用户';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('userModal').style.display = 'block';
        }

        // 编辑用户
        async function editUser(uid) {
            try {
                // 使用多条件查询接口获取用户信息
                const response = await fetch(`${API_BASE}/condition`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid: uid })
                });
                const result = await response.json();
                
                if (result.code === 1) {
                    const users = result.data;
                    if (!users || users.length === 0) {
                        showMessage('用户不存在', 'error');
                        return;
                    }
                    const user = users[0];
                    document.getElementById('modalTitle').textContent = '编辑用户';
                    document.getElementById('userId').value = user.id || '';
                    document.getElementById('uid').value = user.uid || '';
                    document.getElementById('phone').value = user.phone || '';
                    document.getElementById('username').value = user.username || '';
                    document.getElementById('realName').value = user.realName || '';
                    document.getElementById('password').value = user.password || '';
                    document.getElementById('gender').value = user.gender || 0;
                    document.getElementById('birthday').value = user.birthday || '';
                    document.getElementById('role').value = user.role || 0;
                    document.getElementById('studentId').value = user.studentId || '';
                    document.getElementById('idCard').value = user.idCard || '';
                    document.getElementById('college').value = user.college || '';
                    document.getElementById('major').value = user.major || '';
                    document.getElementById('className').value = user.className || '';
                    document.getElementById('dormitory').value = user.dormitory || '';
                    document.getElementById('qq').value = user.qq || '';
                    document.getElementById('wechat').value = user.wechat || '';
                    document.getElementById('avatar').value = user.avatar || '';
                    document.getElementById('hobby').value = user.hobby || '';
                    document.getElementById('status').value = user.status !== undefined ? user.status : 1;
                    
                    document.getElementById('userModal').style.display = 'block';
                } else {
                    showMessage('获取用户信息失败：' + result.message, 'error');
                }
            } catch (error) {
                console.error('获取用户信息失败:', error);
                showMessage('网络请求失败', 'error');
            }
        }

        // 删除用户
        async function deleteUser(uid) {
            if (!confirm('确定要删除该用户吗？此操作不可恢复！')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/delete/${uid}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                
                if (result.code === 1) {
                    showMessage('删除成功', 'success');
                    loadUsers();
                } else {
                    showMessage('删除失败：' + result.message, 'error');
                }
            } catch (error) {
                console.error('删除失败:', error);
                showMessage('网络请求失败', 'error');
            }
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('userModal').style.display = 'none';
        }

        // 表单提交
        document.getElementById('userForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const userId = document.getElementById('userId').value;
            const userData = {
                uid: document.getElementById('uid').value,
                phone: document.getElementById('phone').value,
                username: document.getElementById('username').value,
                realName: document.getElementById('realName').value,
                password: document.getElementById('password').value,
                gender: parseInt(document.getElementById('gender').value),
                birthday: document.getElementById('birthday').value,
                role: parseInt(document.getElementById('role').value),
                studentId: document.getElementById('studentId').value,
                idCard: document.getElementById('idCard').value,
                college: document.getElementById('college').value,
                major: document.getElementById('major').value,
                className: document.getElementById('className').value,
                dormitory: document.getElementById('dormitory').value,
                qq: document.getElementById('qq').value,
                wechat: document.getElementById('wechat').value,
                avatar: document.getElementById('avatar').value,
                hobby: document.getElementById('hobby').value,
                status: parseInt(document.getElementById('status').value)
            };

            if (userId) {
                userData.id = parseInt(userId);
            }

            try {
                const url = userId ? `${API_BASE}/update` : `${API_BASE}/add`;
                const method = userId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                const result = await response.json();
                
                if (result.code === 1) {
                    showMessage(userId ? '更新成功' : '新增成功', 'success');
                    closeModal();
                    loadUsers();
                } else {
                    showMessage((userId ? '更新' : '新增') + '失败：' + result.message, 'error');
                }
            } catch (error) {
                console.error('保存失败:', error);
                showMessage('网络请求失败', 'error');
            }
        });

        // 显示消息提示
        function showMessage(message, type) {
            const div = document.createElement('div');
            div.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 25px;
                border-radius: 8px;
                color: white;
                font-weight: bold;
                z-index: 9999;
                animation: slideIn 0.3s;
                background: ${type === 'success' ? 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)' : 'linear-gradient(135deg, #eb3349 0%, #f45c43 100%)'};
            `;
            div.textContent = message;
            document.body.appendChild(div);

            setTimeout(() => {
                div.remove();
            }, 3000);
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('userModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
