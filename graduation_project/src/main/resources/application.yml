# SpringDoc 接口文档配置（Swagger UI）http://localhost:8080/swagger-ui/index.html#/
springdoc:
  # API 文档接口配置
  api-docs:
    # 是否开启 API 文档生成（true=开启，false=关闭）
    enabled: true
  # Swagger UI 可视化界面配置
  swagger-ui:
    # 是否启用 Swagger UI 界面
    enabled: true
    # 接口标签排序规则：alpha=按字母顺序排序
    tags-sorter: alpha
    # 接口操作排序规则：alpha=按字母顺序排序
    operations-sorter: alpha